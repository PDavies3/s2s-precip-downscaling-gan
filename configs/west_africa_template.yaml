# Same variables/patch settings as ghana_template.yaml, just a bigger region.
# At coarse_resolution_deg=1.5, one patch spans 9 * 1.5 = 13.5 deg on a side.
# west_africa (21 x 34 deg -- see utils/regions.py) tiles into 1 x 2 = 2
# patches per date, vs. ghana's single 1 x 1 patch -- twice the training
# samples at the exact same real coarse/fine resolution (see the `patch`
# comment block in ghana_template.yaml for why that resolution choice was
# made). west_africa is also a physically meaningful training domain in its
# own right, not just a tiling exercise.
extends: ghana_template.yaml
region: west_africa
