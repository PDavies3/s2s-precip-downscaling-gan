# Same variables/patch settings as ghana_template.yaml, but wide enough to
# actually benefit from patch tiling. At coarse_resolution_deg=1.5, one
# patch spans 9 * 1.5 = 13.5 deg on a side; africa (73 x 72 deg -- see
# utils/regions.py) tiles into 5 x 5 = 25 patches per date/lead/member, so
# the model trains across 25 physically distinct geographies -- coastal,
# arid, highland, etc. -- each still at the same real resolution, instead of
# memorizing one or two fixed boxes the way ghana_template.yaml/
# west_africa_template.yaml do (1 and 2 patches respectively).
# Use this when the goal is a model that generalizes across West/wider
# Africa rather than one specialized to a single domain.
extends: ghana_template.yaml
region: africa
